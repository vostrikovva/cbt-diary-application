# Android release build (APK) without EAS.
#
# Required GitHub Secrets:
#   ANDROID_KEYSTORE_BASE64   - base64-encoded release keystore (PKCS12)
#   ANDROID_KEYSTORE_PASSWORD - keystore password
#   ANDROID_KEY_ALIAS         - key alias (e.g. smer-diary)
#   ANDROID_KEY_PASSWORD      - key password
#
# Generate keystore locally (once, back up outside GitHub):
#   keytool -genkeypair -v -storetype PKCS12 \
#     -keystore release.keystore -alias smer-diary \
#     -keyalg RSA -keysize 2048 -validity 10000
#   base64 -w 0 release.keystore   # Linux; use certutil on Windows

name: Android Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Inject version
        id: version
        run: |
          VERSION_CODE="${{ github.run_number }}"

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            jq --arg version "$VERSION" --argjson versionCode "$VERSION_CODE" \
              '.expo.version = $version | .expo.android.versionCode = $versionCode' \
              apps/mobile/app.json > apps/mobile/app.json.tmp
            mv apps/mobile/app.json.tmp apps/mobile/app.json
          else
            VERSION="$(jq -r '.expo.version' apps/mobile/app.json)"
            jq --argjson versionCode "$VERSION_CODE" \
              '.expo.android.versionCode = $versionCode' \
              apps/mobile/app.json > apps/mobile/app.json.tmp
            mv apps/mobile/app.json.tmp apps/mobile/app.json
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: npm run typecheck

      - name: Prebuild Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Decode keystore
        working-directory: apps/mobile/android/app
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/apps/mobile/android/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Prepare APK artifact
        id: apk
        run: |
          APK_PATH="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          OUT_NAME="smer-diary-v${{ steps.version.outputs.version }}-build${{ steps.version.outputs.version_code }}.apk"
          cp "$APK_PATH" "$OUT_NAME"
          echo "path=$OUT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
